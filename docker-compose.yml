version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: bloodbond-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bloodbond}
      MYSQL_USER: ${MYSQL_USER:-bloodbond}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bloodbond}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql-data:
